<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>No connection</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf2e9; color: #3a2c26;
         font: 500 20px/1.5 -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-family: Georgia, serif; font-weight: 600; font-size: 1.6rem; margin: 0 0 .5rem; }
  button { margin-top: 1.2rem; font: inherit; font-weight: 700; padding: .8rem 1.6rem; border: 0; border-radius: 16px; background: #a34e36; color: #fff; }
</style></head>
<body><div>
  <h1>Waiting for the internet</h1>
  <p>Everything is safe. The companion will come back as soon as the Wi‑Fi does.</p>
  <button id="retry">Try again</button>
</div>
<script>
  const go = () => { location.href = 'https://bryanbaise-tech.github.io/memory-companion/'; };
  document.getElementById('retry').addEventListener('click', go);
  setInterval(() => { if (navigator.onLine) go(); }, 15000);
</script>
</body></html>
